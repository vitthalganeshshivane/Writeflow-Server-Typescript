services:
  api-server:
    build: .
    container_name: writeflow-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env

  email-worker:
    build: .
    container_name: writeflow-worker
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    env_file:
      - .env
